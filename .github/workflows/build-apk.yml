name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android/ios folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name game1 --org com.obaidtech --platforms android,ios .
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="game1"/android:label="Party Games"/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk party-games-${{ github.run_number }}.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: party-games-apk
          path: party-games-${{ github.run_number }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Party Games build ${{ github.run_number }}
          body: "Commit: ${{ github.sha }}"
          make_latest: true
          files: party-games-${{ github.run_number }}.apk
